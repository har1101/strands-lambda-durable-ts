name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    name: Example chat app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: npm ci
      - run: npm run typecheck -w @strands-lambda-durable/example-chat-backend
      - run: npm run build -w @strands-lambda-durable/example-chat-backend
      - run: npm run build -w @strands-lambda-durable/example-chat-frontend
      - run: sam validate --lint --template-file examples/chat/backend/template.yaml --region us-east-1
